name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

defaults:
  run:
    working-directory: uniglobe-access-guard

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: uniglobe-access-guard/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build macOS universal app and DMG
        run: npm run build:mac:universal

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uniglobe-access-guard-macos
          path: |
            uniglobe-access-guard/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            uniglobe-access-guard/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

  windows:
    name: Windows NSIS and MSI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: uniglobe-access-guard/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run build:windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uniglobe-access-guard-windows
          path: |
            uniglobe-access-guard/src-tauri/target/release/bundle/nsis/*.exe
            uniglobe-access-guard/src-tauri/target/release/bundle/msi/*.msi
